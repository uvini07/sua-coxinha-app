<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o app desenha embaixo do notch e da barra de gestos.
         interactive-widget=resizes-content: com o documento travado, é isto que
         faz a área visível encolher quando o teclado abre, em vez de o teclado
         cobrir o campo em foco. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Pontos Dourados · Sua Coxinha</title>
    <meta name="description" content="O clube da Sua Coxinha. Sua compra vale ouro." />

    <!-- A barra de status do sistema acompanha o Preto Gourmet -->
    <meta name="theme-color" content="#131313" />
    <meta name="color-scheme" content="dark" />

    <!-- iPhone: sem isso o app abre dentro do Safari mesmo instalado -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pontos Dourados" />
    <link rel="apple-touch-icon" href="./icones/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icones/icone-192.png" type="image/png" />

    <link rel="preload" href="./fontes/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fontes/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fontes/BrownBeige.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
