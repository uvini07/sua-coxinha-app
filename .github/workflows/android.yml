# Compila o APK de teste do Android na nuvem.
#
# Existe porque montar o ambiente Android na mão (SDK, Android Studio, Gradle)
# é a parte mais chata de publicar um app — e para instalar no celular e testar
# não é preciso nada disso. O APK sai como anexo da execução, em Actions.
#
# O que ele NÃO faz: APK assinado para a Play Store. Isto é build de depuração,
# para instalar no aparelho e testar. A versão da loja é assinada com a chave da
# conta, que não entra em repositório.

name: APK de teste (Android)

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write # cria a Release onde o APK fica baixável sem login

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O Gradle do Android precisa de JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Build do app web
        run: npm run build

      # android/ não entra no repositório: é gerado a partir do
      # capacitor.config.json, igual em qualquer máquina.
      - name: Gerar o projeto Android
        run: npx cap add android

      # Sem este arquivo o APK compila e abre, mas o login com Google não
      # funciona — é ele que liga o app ao projeto do Firebase. Vem do console
      # (Configurações do projeto → app Android) e fica guardado como secret,
      # porque aponta para o projeto de produção.
      - name: Ligar ao Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Dois caminhos, porque guardar o arquivo no repositório é mais
          # simples para quem não lida com secrets todo dia — e este arquivo
          # não é segredo: ele viaja dentro de cada APK publicado, de onde
          # qualquer um extrai. Quem protege os dados são as regras do
          # Firestore. O secret tem prioridade, para dar como sobrescrever sem
          # mexer no repositório.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json veio do secret — login com Google ativo."
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "google-services.json veio do repositório — login com Google ativo."
          else
            echo "::warning::Nenhum google-services.json (nem secret, nem firebase/google-services.json). O APK abre, mas o login com Google vai falhar."
          fi

      # A chave que assina o APK decide a SHA-1 que o Google exige ver
      # cadastrada no Firebase. Sem uma chave fixa, o Gradle gera uma nova a
      # cada execução, a SHA-1 muda e o login passa a falhar sozinho — sem
      # ninguém ter mexido em nada. Por isso a chave vem de um secret.
      #
      # O arquivo tem alias `androiddebugkey` e senha `android`, a convenção do
      # Android: assim o Gradle o usa sem precisar de configuração nenhuma.
      - name: Fixar a chave de assinatura
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Chave fixa aplicada — a SHA-1 não muda entre builds."
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE_BASE64 ausente. O Gradle vai gerar uma chave nova, a SHA-1 muda a cada build e o login com Google vai parar de funcionar sozinho."
          fi

      - name: Sincronizar web → nativo
        run: npx cap sync android

      - name: Compilar
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Nome fixo, para o link de download nunca mudar.
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pontos-dourados.apk

      # Lê a SHA-1 do próprio APK e deixa à mostra no resumo da execução. É
      # exatamente o valor que precisa estar cadastrado no Firebase — sem isto,
      # descobrir qual é vira adivinhação.
      - name: Mostrar a SHA-1 para cadastrar no Firebase
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          sha=$("$apksigner" verify --print-certs pontos-dourados.apk | grep -i 'SHA-1 digest' | head -1 | awk '{print $NF}')
          # apksigner imprime sem os dois-pontos; o Firebase espera com.
          formatada=$(echo "$sha" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "SHA-1: $formatada"
          {
            echo "### SHA-1 para cadastrar no Firebase"
            echo ""
            echo '```'
            echo "$formatada"
            echo '```'
            echo ""
            echo "Firebase → Configurações do projeto → app Android → Adicionar impressão digital."
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact do Actions exige login no GitHub e entrega um .zip — e o
      # Android não instala APK de dentro de zip. Serve para guardar histórico,
      # não para instalar no celular.
      - name: Guardar no histórico da execução
        uses: actions/upload-artifact@v4
        with:
          name: pontos-dourados-apk
          path: pontos-dourados.apk
          if-no-files-found: error
          retention-days: 30

      # Este é o caminho que funciona no celular: a Release serve o .apk puro,
      # por link direto, sem exigir conta no GitHub. Abre no navegador do
      # telefone e instala.
      #
      # A tag é fixa e vai sendo sobrescrita: assim o link de download é sempre
      # o mesmo, e a última compilação do main está sempre nele.
      - name: Publicar para download no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="Build automático de $(date -u '+%d/%m/%Y %H:%M') UTC, do commit ${GITHUB_SHA:0:7}.

          **Como instalar:** abra este link no navegador do celular Android, baixe o
          \`pontos-dourados.apk\` e toque no arquivo. O Android vai pedir para autorizar
          instalação de fonte desconhecida — é normal em app fora da Play Store.

          APK de teste, assinado com a chave de depuração. Não é a versão da loja.

          Para iPhone não há equivalente: a Apple exige conta de desenvolvedor paga para
          instalar em aparelho. No iOS, use o app pelo navegador (Safari → Compartilhar →
          Adicionar à Tela de Início)."

          gh release delete apk-teste --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-teste pontos-dourados.apk \
            --title "APK de teste — última versão" \
            --notes "$notas" \
            --prerelease
          echo "### APK pronto para o celular" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-teste/pontos-dourados.apk" >> "$GITHUB_STEP_SUMMARY" 
